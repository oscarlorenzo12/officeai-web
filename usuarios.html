<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OfficeAI | Usuarios</title><style>body{font:16px system-ui;background:#0b1220;color:#eaf0fb;max-width:900px;margin:auto;padding:20px}section{background:#152238;padding:18px;border-radius:12px;margin:16px 0}input,select,button{font:inherit;padding:10px;margin:5px;background:#203653;color:white;border:1px solid #60738c;border-radius:7px;max-width:100%}a{color:#9fd2ff}article{border-bottom:1px solid #40516a;padding:12px;overflow-wrap:anywhere}[hidden]{display:none!important}</style><body><nav><a href="./index.html">Inicio</a> · <a href="./incorporacion.html">Incorporación</a></nav><h1>Usuarios y permisos</h1><section id="login"><input id="email" type="email" placeholder="Correo" aria-label="Correo"><input id="password" type="password" placeholder="Contraseña" aria-label="Contraseña"><button id="enter">Entrar</button></section><section id="panel" hidden><button id="exit">Cerrar sesión</button><label>Negocio <select id="org"></select></label><div id="members"></div></section><p id="status" role="status"></p><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const db=createClient('https://zzzodfhbwnpnwnmgjdyw.supabase.co','sb_publishable_Mpgb7CcIhKIJeOsFtYEZ5g_vGZblgzp');const $=id=>document.getElementById(id);let epoch=0,user=null;const msg=t=>$('status').textContent=t;function clear(){epoch++;user=null;$('members').replaceChildren();$('org').replaceChildren();$('panel').hidden=true;$('login').hidden=false;}
async function load(){const e=++epoch,id=$('org').value;$('members').replaceChildren();if(!id)return;const {data,error}=await db.from('organization_members').select('id,user_id,role').eq('organization_id',id);if(e!==epoch)return;if(error)throw error;const owner=data.some(m=>m.user_id===user&&m.role==='owner');for(const m of data){const row=document.createElement('article');const label=document.createElement('p');label.textContent=(m.user_id===user?'Tu cuenta · ':'Usuario · ')+m.user_id+' · '+({owner:'Propietario',admin:'Administrador',member:'Empleado'}[m.role]||m.role);row.append(label);if(owner&&m.role!=='owner'&&m.user_id!==user){const b=document.createElement('button');b.textContent=m.role==='admin'?'Cambiar a empleado':'Cambiar a administrador';b.onclick=async()=>{if(e!==epoch||!confirm('¿Confirmas el cambio de permisos?'))return;b.disabled=true;try{const {error}=await db.rpc('officeai_change_member_role',{p_member:m.id,p_role:m.role==='admin'?'member':'admin'});if(error)throw error;if(e===epoch){await load();msg('Permisos actualizados')}}catch(ex){msg(ex.message)}finally{b.disabled=false}};row.append(b);const remove=document.createElement('button');remove.textContent='Retirar acceso';remove.style.background='#722f3c';remove.onclick=async()=>{if(e!==epoch||!confirm('¿Retirar el acceso de este usuario a este negocio?'))return;remove.disabled=true;b.disabled=true;try{const {error}=await db.rpc('officeai_remove_member',{p_member:m.id});if(error)throw error;if(e===epoch){await load();msg('Acceso retirado')}}catch(ex){if(e===epoch)msg(ex.message)}finally{remove.disabled=false;b.disabled=false}};row.append(remove)}$('members').append(row)}}
async function init(){const e=++epoch;const {data}=await db.auth.getUser();if(e!==epoch)return;if(!data.user){clear();return}user=data.user.id;const {data:orgs,error}=await db.from('organizations').select('id,name').order('name');if(e!==epoch)return;if(error)throw error;$('org').replaceChildren();for(const o of orgs){const opt=document.createElement('option');opt.value=o.id;opt.textContent=o.name;$('org').append(opt)}$('login').hidden=true;$('panel').hidden=false;await load();if(!orgs.length)msg('No tienes negocios asignados.')}
$('org').onchange=()=>load().catch(e=>msg(e.message));$('enter').onclick=async()=>{try{const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(error)throw error;await init()}catch(e){msg(e.message)}};$('exit').onclick=async()=>{const {error}=await db.auth.signOut();if(error)msg(error.message);else clear()};db.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT')clear()});await init().catch(e=>msg(e.message));
</script></body></html>
