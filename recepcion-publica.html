<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OfficeAI · Recepción piloto</title><style>body{font:16px system-ui;background:#101b30;color:white;margin:0}main{max-width:650px;margin:auto;padding:24px}section{background:#20314b;padding:20px;border-radius:12px;margin:16px 0}label{display:block;margin:12px 0}input:not([type=checkbox]),textarea,select{display:block;width:100%;box-sizing:border-box;padding:10px;font:inherit}button{padding:12px;background:#8bd0ff;border:0;border-radius:8px;font:inherit}p{overflow-wrap:anywhere}a{color:#8bd0ff}</style><main><h1>OfficeAI · Recepción piloto</h1><p>Entorno de pruebas. No introduzcas datos personales reales. Las citas requieren confirmación humana.</p><section><h2>Consultar al negocio</h2><form id="question"><label>Pregunta<input name="question" required maxlength="500"></label><button>Consultar</button></form><p id="answer" role="status"></p></section><section><h2>Registrar solicitud de prueba</h2><form id="intake"><label>Tipo<select name="request_type"><option value="information">Información</option><option value="appointment">Cita</option><option value="callback">Devolución de llamada</option></select></label><label>Horario preferido<select name="preferred_slot"><option value="any">Indiferente</option><option value="morning">Mañana</option><option value="afternoon">Tarde</option></select></label><label>Detalles ficticios<textarea name="note" required maxlength="1000"></textarea></label><label><input type="checkbox" name="consent" required> Acepto registrar esta solicitud ficticia para revisión interna.</label><button>Registrar prueba</button></form><p id="result" role="status"></p></section><a href="./assistant-demo.html">Volver al simulador</a></main><script>
const endpoint="https://zzzodfhbwnpnwnmgjdyw.supabase.co/functions/v1/officeai-reception-public";
const instance="4c4dad72-5589-428c-beee-5863e7b3edff";
async function submit(form,action,out){const button=form.querySelector("button");button.disabled=true;out.textContent="Consultando…";try{const data=Object.fromEntries(new FormData(form));if(action==="intake")data.consent=form.elements.consent.checked;const response=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...data,action,instance_id:instance})});const result=await response.json();if(!response.ok)throw Error("HTTP "+response.status+": "+(result.error||"Servicio no disponible"));if(action==="answer"){out.textContent=result.answer||"Sin respuesta";}else{if(result.ok!==true||!result.request_id)throw Error("Registro no confirmado");out.textContent="Solicitud registrada: "+result.request_id+". Pendiente de revisión; cita no confirmada.";form.reset();}}catch(e){out.textContent="No se pudo completar: "+e.message;}finally{button.disabled=false;}}
document.getElementById("question").onsubmit=e=>{e.preventDefault();submit(e.currentTarget,"answer",document.getElementById("answer"));};document.getElementById("intake").onsubmit=e=>{e.preventDefault();submit(e.currentTarget,"intake",document.getElementById("result"));};
</script></html>
