<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OfficeAI · Negocios</title><style>body{background:#0b1424;color:#edf3ff;font:16px system-ui;margin:0}main{max-width:850px;margin:auto;padding:20px}section{background:#18263b;border:1px solid #334761;border-radius:12px;padding:18px;margin:16px 0}input,textarea,select,button{font:inherit;padding:10px;border-radius:8px;box-sizing:border-box;width:100%;margin:5px 0}input,textarea,select{background:#0b1424;color:white;border:1px solid #789}button{background:#5fd4b7;color:#092820;border:0;cursor:pointer}button:disabled{opacity:.5}a{color:#9bd4ff}</style></head><body><main><h1>OfficeAI · Configurar negocios</h1><p>Entorno de pruebas: los negocios nuevos se crean privados.</p><section id="login" hidden><h2>Acceso</h2><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button id="enter">Entrar</button></section><div id="panel" hidden><section><h2>Negocio</h2><select id="instance"></select><button id="new">Nuevo negocio de prueba</button></section><section><h2>Configuración</h2><label>Nombre comercial<input id="business_name" maxlength="150"></label><label>Servicio<input id="service_name" maxlength="150"></label><label>Horario<textarea id="business_hours" rows="2"></textarea></label><label>Ubicación<textarea id="location_text" rows="2"></textarea></label><label>Preguntas frecuentes (pregunta | respuesta por línea)<textarea id="faq" rows="5"></textarea></label><button id="save">Guardar configuración</button></section><button id="logout">Cerrar sesión</button></div><section><strong>Estado</strong><p id="message">Comprobando sesión...</p></section><p><a href="./solicitudes-officeai.html">Solicitudes</a> · <a href="./recepcion.html">Recepción</a></p></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const sb=createClient('https://zzzodfhbwnpnwnmgjdyw.supabase.co','sb_publishable_Mpgb7CcIhKIJeOsFtYEZ5g_vGZblgzp');const $=id=>document.getElementById(id);let org='',items=[];const msg=t=>$('message').textContent=t;
function fill(){const r=items.find(x=>x.id===$('instance').value);for(const k of ['business_name','service_name','business_hours','location_text'])$(k).value=r?.[k]||'';$('faq').value=(r?.faq||[]).map(x=>x.question+' | '+x.answer).join('\n')}
async function boot(){const{data:{user}}=await sb.auth.getUser();$('login').hidden=!!user;$('panel').hidden=!user;if(!user){msg('Inicia sesión con tu cuenta OfficeAI');return}const{data:m,error:e}=await sb.from('organization_members').select('organization_id').eq('user_id',user.id);if(e)throw e;if(!m?.length)throw Error('No tienes organización asignada');org=m[0].organization_id;await reload()}
async function reload(selected){const{data,error}=await sb.from('service_instances').select('id,service_name,business_name,business_hours,location_text,faq').eq('organization_id',org).order('created_at');if(error)throw error;items=data||[];$('instance').replaceChildren(...items.map(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.business_name;return o}));if(selected)$('instance').value=selected;fill();msg('Negocios cargados: '+items.length)}
$('instance').onchange=fill;
$('new').onclick=()=>{const o=document.createElement('option');o.value='new';o.textContent='Nuevo negocio (privado)';$('instance').prepend(o);$('instance').value='new';fill();msg('Introduce datos ficticios y pulsa Guardar')};
$('save').onclick=async()=>{const b=$('save');try{b.disabled=true;const name=$('business_name').value.trim(),service=$('service_name').value.trim();if(!name||!service)throw Error('Indica el nombre y el servicio');const faq=$('faq').value.split('\n').filter(x=>x.trim()).map(line=>{const i=line.indexOf('|');if(i<1||i===line.length-1)throw Error('Formato: pregunta | respuesta');return{question:line.slice(0,i).trim(),answer:line.slice(i+1).trim()}});if(faq.length>30)throw Error('Máximo 30 preguntas');const row={business_name:name,service_name:service,business_hours:$('business_hours').value.trim(),location_text:$('location_text').value.trim(),faq};const q=$('instance').value==='new'?sb.from('service_instances').insert({...row,organization_id:org,public_enabled:false}).select('id').single():sb.from('service_instances').update(row).eq('id',$('instance').value).eq('organization_id',org).select('id').single();const{data,error}=await q;if(error)throw error;await reload(data.id);msg('Configuración guardada correctamente')}catch(e){msg('Error: '+e.message)}finally{b.disabled=false}};
$('enter').onclick=async()=>{try{const{error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';await boot()}catch(e){msg('Error: '+e.message)}};
$('logout').onclick=async()=>{await sb.auth.signOut();await boot()};boot().catch(e=>msg('Error: '+e.message));
</script></body></html>
