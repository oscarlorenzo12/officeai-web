<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OfficeAI · Tarifas</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1728;color:#eff5ff;font:16px system-ui}main{max-width:850px;margin:auto;padding:22px}section{border:1px solid #334961;background:#192a43;border-radius:14px;padding:18px;margin:16px 0}input,select,textarea,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #60718a;margin:5px 0}input,select,textarea{width:100%;background:#101d31;color:white}button{background:#58b7ff;color:#071629;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}article{border:1px solid #4b617a;padding:13px;margin:10px 0;border-radius:10px}p,small{color:#b9c9dc}</style></head><body><main><h1>OfficeAI · Catálogo de tarifas</h1><p>Configura los precios autorizados. Las tarifas nuevas permanecen en borrador hasta que un administrador las active.</p><section><h2>Acceso</h2><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button id="login">Entrar</button> <button id="logout">Salir</button><p id="status" role="status"></p></section><div id="app" hidden><section><h2>Empresa</h2><select id="org"></select><button id="reload">Actualizar</button></section><section><h2>Nueva tarifa en borrador</h2><form id="form"><input name="code" required maxlength="80" placeholder="Código interno (ej. web-basico)"><input name="name" required maxlength="150" placeholder="Nombre del servicio"><textarea name="description" maxlength="2000" placeholder="Qué incluye y qué no incluye"></textarea><label>Alta (€)<input name="setup_price_eur" type="number" min="0" step=".01" value="0" required></label><label>Mensualidad (€)<input name="monthly_price_eur" type="number" min="0" step=".01" value="0" required></label><button>Guardar borrador</button></form></section><section><h2>Tarifas</h2><div id="items"></div></section></div></main><script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.57.0";
const db=createClient("https://zzzodfhbwnpnwnmgjdyw.supabase.co","sb_publishable_Mpgb7CcIhKIJeOsFtYEZ5g_vGZblgzp");const $=x=>document.getElementById(x);let roles={};const msg=t=>$("status").textContent=t;
async function loadOrgs(){const {data:{user}}=await db.auth.getUser();if(!user)return;const {data,error}=await db.from("organization_members").select("organization_id,role").eq("user_id",user.id);if(error){msg(error.message);return}roles=Object.fromEntries((data||[]).map(x=>[x.organization_id,x.role]));const ids=Object.keys(roles);$("org").replaceChildren();if(!ids.length){msg("No tienes organizaciones asociadas.");return}const {data:orgs,error:e}=await db.from("organizations").select("id,name").in("id",ids);if(e){msg(e.message);return}for(const o of orgs||[])$("org").add(new Option(o.name,o.id));await load()}
async function load(){const id=$("org").value;if(!id)return;const {data,error}=await db.from("service_catalog").select("id,code,name,description,setup_price_eur,monthly_price_eur,status").eq("organization_id",id).order("created_at",{ascending:false}).limit(100);const root=$("items");root.replaceChildren();if(error){root.textContent=error.message;return}if(!data?.length){root.textContent="Sin tarifas configuradas.";return}for(const x of data){const card=document.createElement("article");const title=document.createElement("strong");title.textContent=x.name+" ("+x.code+")";card.append(title);const p=document.createElement("p");p.textContent=(x.description||"")+" · Alta "+Number(x.setup_price_eur||0).toFixed(2)+" € · Mensualidad "+Number(x.monthly_price_eur||0).toFixed(2)+" € · "+x.status;card.append(p);if(["owner","admin"].includes(roles[id])&&["draft","active"].includes(x.status)){const next=x.status==="draft"?"active":"draft";const btn=document.createElement("button");btn.textContent=next==="active"?"Activar tarifa":"Desactivar tarifa";btn.onclick=async()=>{if(next==="active"&&!confirm("¿Confirmas que autorizas esta tarifa para preparar presupuestos?"))return;btn.disabled=true;const {error}=await db.from("service_catalog").update({status:next}).eq("id",x.id).eq("organization_id",id);msg(error?"No se pudo actualizar: "+error.message:"Tarifa actualizada.");await load()};card.append(btn)}root.append(card)}}
async function refresh(){const {data:{session}}=await db.auth.getSession();$("app").hidden=!session;msg(session?"Sesión: "+session.user.email:"Inicia sesión");if(session)await loadOrgs()}
$("login").onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});$("password").value="";if(error)msg(error.message);else await refresh()};$("logout").onclick=async()=>{await db.auth.signOut();$("app").hidden=true;msg("Sesión cerrada")};$("org").onchange=load;$("reload").onclick=load;
$("form").onsubmit=async e=>{e.preventDefault();const id=$("org").value;if(!id)return;const f=new FormData(e.target);const setup=Number(f.get("setup_price_eur")),monthly=Number(f.get("monthly_price_eur"));if(!Number.isFinite(setup)||!Number.isFinite(monthly)||setup<0||monthly<0){msg("Importes inválidos");return}const code=String(f.get("code")).trim().toLowerCase().replace(/-/g,"_");if(!/^[a-z0-9_]{3,40}$/.test(code)){msg("Código inválido: usa entre 3 y 40 letras minúsculas, números o guiones bajos.");return}const {error}=await db.from("service_catalog").insert({organization_id:id,code,name:String(f.get("name")).trim(),description:String(f.get("description")).trim(),setup_price_eur:setup,monthly_price_eur:monthly,status:"draft"});if(error)msg("Error: "+error.message);else{msg("Tarifa guardada en borrador. Debes activarla expresamente.");e.target.reset();await load()}};await refresh();
</script></body></html>
