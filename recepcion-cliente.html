<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recepcionista virtual · OfficeAI</title><style>body{font:16px system-ui;background:#0b1729;color:#eef5ff;max-width:640px;margin:auto;padding:24px}section{background:#182840;padding:20px;border-radius:14px;margin:16px 0}label{display:block;margin:12px 0}textarea,select,button{font:inherit;padding:10px;max-width:100%;box-sizing:border-box}textarea{width:100%}button{cursor:pointer}p{overflow-wrap:anywhere}</style></head><body><h1 id="business">Recepcionista virtual</h1><p id="availability" role="status">Comprobando disponibilidad…</p><p>Las solicitudes quedan pendientes de revisión. No se confirman citas automáticamente.</p><section><form id="ask" hidden><label>Tu consulta<textarea id="question" required maxlength="500"></textarea></label><button>Consultar</button></form><p id="answer" role="status"></p></section><section><form id="intake" hidden><label>Tipo de solicitud<select id="kind"><option value="information">Información</option><option value="appointment">Cita</option><option value="callback">Devolución de llamada</option></select></label><label>Preferencia<select id="slot"><option value="any">Indiferente</option><option value="morning">Mañana</option><option value="afternoon">Tarde</option></select></label><label>Solicitud y contacto para responder<textarea id="note" required maxlength="1000"></textarea></label><label><input id="consent" type="checkbox" required> Autorizo el tratamiento de estos datos para atender mi solicitud. No incluyas datos sensibles.</label><p><a id="privacy" target="_blank" rel="noopener noreferrer" style="color:#9fd2ff">Aviso de privacidad del negocio</a></p><button>Registrar solicitud</button></form><p id="result" role="status"></p></section><script>
const id=new URLSearchParams(location.search).get('negocio'),$=x=>document.getElementById(x);const valid=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id||'');async function call(body){if(!valid)throw Error('Enlace de negocio no válido');const r=await fetch('https://zzzodfhbwnpnwnmgjdyw.supabase.co/functions/v1/officeai-reception-public',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({instance_id:id,...body})});const d=await r.json();if(!r.ok)throw Error(d.error||'Servicio no disponible');return d}function wire(form,out,fn){$(form).onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');if(b.disabled)return;b.disabled=true;$(out).textContent='Procesando…';try{$(out).textContent=await fn()}catch(e){$(out).textContent=e.message}finally{b.disabled=false}}}wire('ask','answer',async()=> (await call({action:'answer',question:$('question').value})).answer);wire('intake','result',async()=>{const d=await call({action:'intake',request_type:$('kind').value,preferred_slot:$('slot').value,note:$('note').value,consent:$('consent').checked});$('intake').reset();return 'Solicitud registrada: '+d.request_id+'. Pendiente de revisión; cita no confirmada.'});async function init(){try{const d=await call({action:'info'});const url=new URL(d.privacy_notice_url);if(url.protocol!=='https:')throw Error('Aviso de privacidad no disponible');$('business').textContent=d.business_name||'Recepcionista virtual';$('privacy').href=url.href;$('availability').textContent='Servicio disponible';$('ask').hidden=false;$('intake').hidden=false}catch(e){$('availability').textContent=e.message}}init();
</script></body></html>
