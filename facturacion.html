<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OfficeAI · Facturación</title><style>body{font:16px system-ui;background:#0b1220;color:#eaf0fb;max-width:850px;margin:auto;padding:20px}a{color:#9fd2ff}form{background:#152238;padding:16px;border-radius:12px;margin:12px 0}label{display:block;margin:10px 0}input,textarea,select,button{font:inherit;padding:8px;max-width:95%}input,textarea{display:block;width:90%}</style><h1>Datos fiscales</h1><a href="./index.html">Panel principal</a><p>Configuración interna. No emite facturas fiscales.</p><label>Negocio <select id="org"></select></label><p id="notice" role="status"></p><main id="items"></main><h2>Borradores de mensualidades</h2><section id="drafts"></section><script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.57.0";
const db=createClient("https://zzzodfhbwnpnwnmgjdyw.supabase.co","sb_publishable_Mpgb7CcIhKIJeOsFtYEZ5g_vGZblgzp");const $=id=>document.getElementById(id);let epoch=0;
async function load(){const e=++epoch,id=$('org').value;$('items').replaceChildren();$('drafts').replaceChildren();if(!id)return;const {data,error}=await db.from('officeai_billing_profiles').select('profile_kind,legal_name,tax_id,fiscal_address,country_code').eq('organization_id',id);if(e!==epoch)return;if(error){$('notice').textContent=error.message;return}$('notice').textContent='';for(const [kind,title] of [['issuer','Emisor'],['customer','Cliente']]){const old=(data||[]).find(x=>x.profile_kind===kind)||{},f=document.createElement('form'),h=document.createElement('h2');h.textContent=title;f.append(h);for(const [key,label,max] of [['legal_name','Razón social',200],['tax_id','Identificación fiscal',40],['fiscal_address','Domicilio fiscal',500],['country_code','Código de país (ISO de dos letras)',2]]){const l=document.createElement('label'),i=document.createElement(key==='fiscal_address'?'textarea':'input');l.textContent=label;i.name=key;i.required=true;i.maxLength=max;i.value=old[key]||'';if(key==='country_code')i.pattern='[A-Za-z]{2}';l.append(i);f.append(l)}const b=document.createElement('button');b.textContent='Guardar '+title.toLowerCase();f.append(b);f.onsubmit=async ev=>{ev.preventDefault();if(e!==epoch)return;const v=Object.fromEntries(new FormData(f));for(const k in v)v[k]=v[k].trim();v.country_code=v.country_code.toUpperCase();if(Object.values(v).some(x=>!x)||! /^[A-Z]{2}$/.test(v.country_code)){$('notice').textContent='Revisa los campos.';return}b.disabled=true;try{const {error}=await db.from('officeai_billing_profiles').upsert({...v,organization_id:id,profile_kind:kind,updated_at:new Date().toISOString()},{onConflict:'organization_id,profile_kind'});if(e!==epoch)return;$('notice').textContent=error?error.message:'Datos fiscales guardados.'}finally{b.disabled=false}};$('items').append(f)}await drafts(id,e)}
async function drafts(id,e){const {data,error}=await db.from('officeai_billing_drafts').select('id,net_eur,vat_rate,officeai_monthly_payments!inner(period,officeai_service_contracts!inner(service_name,organization_id))').eq('officeai_monthly_payments.officeai_service_contracts.organization_id',id);if(e!==epoch)return;if(error){$('drafts').textContent=error.message;return}const money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n);for(const d of data||[]){const a=document.createElement('p'),p=d.officeai_monthly_payments,n=Number(d.net_eur);a.textContent=p.officeai_service_contracts.service_name+' · '+p.period+' · Base: '+money(n)+' · '+(d.vat_rate===null?'IVA pendiente':'IVA '+d.vat_rate+'% · Total '+money(n+Math.round(n*Number(d.vat_rate))/100))+' · Borrador sin validez fiscal';$('drafts').append(a)}if(!data?.length)$('drafts').textContent='Sin borradores.'}
async function init(){const e=++epoch;const {data:{user}}=await db.auth.getUser();if(e!==epoch)return;if(!user){$('notice').textContent='Inicia sesión en el panel principal.';return}const {data:m,error}=await db.from('organization_members').select('organization_id').eq('user_id',user.id).eq('role','owner');if(e!==epoch)return;if(error||!m?.length){$('notice').textContent=error?.message||'Sin negocios autorizados.';return}const {data:o,error:oe}=await db.from('organizations').select('id,name').in('id',m.map(x=>x.organization_id));if(e!==epoch)return;if(oe){$('notice').textContent=oe.message;return}for(const x of o||[])$('org').add(new Option(x.name,x.id));await load()}$('org').onchange=load;db.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT'){++epoch;$('org').replaceChildren();$('items').replaceChildren();$('drafts').replaceChildren();$('notice').textContent='Sesión cerrada.'}});await init();
</script></html>
