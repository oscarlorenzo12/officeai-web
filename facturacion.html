<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OfficeAI · Facturación</title><style>body{font:16px system-ui;background:#0b1220;color:#eaf0fb;max-width:850px;margin:auto;padding:20px}a{color:#9fd2ff}form{background:#152238;padding:16px;border-radius:12px;margin:12px 0}label{display:block;margin:10px 0}input,textarea,select,button{font:inherit;padding:8px;max-width:95%}input,textarea{display:block;width:90%}@media print{body{background:white;color:black;max-width:none}body>*{display:none!important}body> #printDraft{display:block!important}#printDraft{white-space:pre-wrap;font:14px system-ui}}.office-nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 24px}.office-nav a{padding:9px 12px;border:1px solid #41536d;border-radius:8px;text-decoration:none}.office-nav a[aria-current=page]{background:#25456a}button{cursor:pointer;border-radius:7px}button:disabled{opacity:.6}@media(max-width:480px){.office-nav a{flex:1 1 35%;text-align:center}}@media print{.office-nav{display:none!important}}</style><section id="printDraft" hidden></section><h1>Datos fiscales</h1><nav class="office-nav" aria-label="Gestión de OfficeAI"><a href="./index.html">Inicio</a><a href="./contratos.html">Contratos</a><a href="./finanzas.html">Finanzas</a><a href="./facturacion.html" aria-current="page">Facturación</a></nav><p>Configuración interna. No emite facturas fiscales.</p><label>Negocio <select id="org"></select></label><p id="notice" role="status"></p><main id="items"></main><h2>Borradores de altas y mensualidades</h2><section id="drafts"></section><script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.57.0";
const db=createClient("https://zzzodfhbwnpnwnmgjdyw.supabase.co","sb_publishable_Mpgb7CcIhKIJeOsFtYEZ5g_vGZblgzp");const $=id=>document.getElementById(id);let epoch=0;
async function load(){const e=++epoch,id=$('org').value;$('items').replaceChildren();$('drafts').replaceChildren();if(!id)return;const {data,error}=await db.from('officeai_billing_profiles').select('profile_kind,legal_name,tax_id,fiscal_address,country_code').eq('organization_id',id);if(e!==epoch)return;if(error){$('notice').textContent=error.message;return}$('notice').textContent='';for(const [kind,title] of [['issuer','Emisor'],['customer','Cliente']]){const old=(data||[]).find(x=>x.profile_kind===kind)||{},f=document.createElement('form'),h=document.createElement('h2');h.textContent=title;f.append(h);for(const [key,label,max] of [['legal_name','Razón social',200],['tax_id','Identificación fiscal',40],['fiscal_address','Domicilio fiscal',500],['country_code','Código de país (ISO de dos letras)',2]]){const l=document.createElement('label'),i=document.createElement(key==='fiscal_address'?'textarea':'input');l.textContent=label;i.name=key;i.required=true;i.maxLength=max;i.value=old[key]||'';if(key==='country_code')i.pattern='[A-Za-z]{2}';l.append(i);f.append(l)}const b=document.createElement('button');b.textContent='Guardar '+title.toLowerCase();f.append(b);f.onsubmit=async ev=>{ev.preventDefault();if(e!==epoch)return;const v=Object.fromEntries(new FormData(f));for(const k in v)v[k]=v[k].trim();v.country_code=v.country_code.toUpperCase();if(Object.values(v).some(x=>!x)||! /^[A-Z]{2}$/.test(v.country_code)){$('notice').textContent='Revisa los campos.';return}b.disabled=true;try{const {error}=await db.from('officeai_billing_profiles').upsert({...v,organization_id:id,profile_kind:kind,updated_at:new Date().toISOString()},{onConflict:'organization_id,profile_kind'});if(e!==epoch)return;if(error){$('notice').textContent=error.message}else{await load();$('notice').textContent='Datos fiscales guardados.'}}finally{b.disabled=false}};$('items').append(f)}await drafts(id,e,data||[])}
async function drafts(id,e,profiles){const {data:monthly,error}=await db.from('officeai_billing_drafts').select('id,net_eur,vat_rate,officeai_monthly_payments!inner(period,officeai_service_contracts!inner(service_name,organization_id))').eq('officeai_monthly_payments.officeai_service_contracts.organization_id',id);const {data:setup,error:se}=await db.from('officeai_billing_drafts').select('id,net_eur,vat_rate,officeai_service_contracts!inner(service_name,organization_id)').eq('officeai_service_contracts.organization_id',id);const data=[...(monthly||[]),...(setup||[]).map(x=>({...x,officeai_monthly_payments:{period:'Alta inicial',officeai_service_contracts:x.officeai_service_contracts}}))];if(se){if(e===epoch)$('drafts').textContent=se.message;return}if(e!==epoch)return;if(error){$('drafts').textContent=error.message;return}const {data:linked,error:le}=await db.from('officeai_invoices').select('source_billing_draft_id,invoice_number,status').eq('organization_id',id).not('source_billing_draft_id','is',null);if(e!==epoch)return;if(le){$('drafts').textContent='No se pudo comprobar la vinculación de facturas: '+le.message;return}const {data:instances,error:ie}=await db.from('service_instances').select('id,business_name,service_name').eq('organization_id',id);if(e!==epoch)return;if(ie){$('drafts').textContent=ie.message;return}const links=new Map((linked||[]).map(x=>[x.source_billing_draft_id,x]));const money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n);for(const d of data||[]){const a=document.createElement('p'),p=d.officeai_monthly_payments,n=Number(d.net_eur);a.textContent=p.officeai_service_contracts.service_name+' · '+p.period+' · Base: '+money(n)+' · '+(d.vat_rate===null?'IVA pendiente':'IVA '+d.vat_rate+'% · Total '+money(n+Math.round(n*Number(d.vat_rate))/100))+' · Borrador sin validez fiscal';const b=document.createElement('button');b.textContent='Imprimir / guardar PDF';b.onclick=()=>{if(e!==epoch)return;const lines=['OFFICEAI','BORRADOR SIN VALIDEZ FISCAL','No es una factura ni justificante de pago.',''];for(const [kind,label] of [['issuer','Emisor'],['customer','Cliente']]){const f=profiles.find(x=>x.profile_kind===kind);if(!f){$('notice').textContent='Completa las dos fichas fiscales antes de imprimir.';return}lines.push(label,f.legal_name,f.tax_id,f.fiscal_address,f.country_code,'')}lines.push('Servicio: '+p.officeai_service_contracts.service_name,'Periodo: '+p.period,'Base: '+money(n),d.vat_rate===null?'IVA y total pendientes de revisión':'IVA: '+d.vat_rate+'% · '+money(Math.round(n*Number(d.vat_rate))/100),d.vat_rate===null?'':'Total: '+money(n+Math.round(n*Number(d.vat_rate))/100),'Referencia interna: '+d.id);$('printDraft').textContent=lines.join('\n');window.print();$('printDraft').textContent=''};const edit=document.createElement('button');edit.textContent='Corregir IVA';edit.onclick=async()=>{if(e!==epoch)return;const raw=prompt('IVA confirmado (%), vacío si pendiente',d.vat_rate??'');if(raw===null)return;const v=raw.trim()===''?null:Number(raw.replace(',','.'));if(v!==null&&(!Number.isFinite(v)||v<0||v>100||Math.abs(v*100-Math.round(v*100))>1e-8)){$('notice').textContent='IVA no válido (máximo dos decimales).';return}edit.disabled=true;try{const {error}=await db.rpc('officeai_revise_billing_vat',{p_id:d.id,p_vat:v});if(e!==epoch)return;if(error)$('notice').textContent=error.message;else{await load();$('notice').textContent='IVA actualizado.'}}finally{edit.disabled=false}};const linkedInvoice=links.get(d.id);if(linkedInvoice){edit.disabled=true;edit.title='IVA bloqueado: borrador vinculado';const info=document.createElement('span');info.textContent=' · Factura vinculada: '+linkedInvoice.invoice_number+' ('+linkedInvoice.status+') ';a.append(info)}a.append(b,edit);if(!linkedInvoice){const pick=document.createElement('select');pick.setAttribute('aria-label','Establecimiento de facturación');pick.add(new Option('Selecciona establecimiento',''));for(const x of instances||[])pick.add(new Option(x.business_name+' · '+x.service_name,x.id));const prep=document.createElement('button');prep.textContent='Preparar factura interna';prep.disabled=d.vat_rate===null||!instances?.length;prep.onclick=async()=>{if(e!==epoch||!pick.value)return;const instance=pick.value;const number=prompt('Referencia interna única (no numeración fiscal)');if(number===null||!number.trim()||number.trim().length>60)return;if(!confirm('Crear registro en borrador, sin emitir factura ni cobrar?'))return;prep.disabled=true;try{const {error}=await db.rpc('officeai_prepare_linked_invoice',{p_draft:d.id,p_instance:instance,p_number:number.trim()});if(e!==epoch)return;if(error){$('notice').textContent=error.message;prep.disabled=false;return}await load()}catch(err){if(e===epoch){$('notice').textContent='No se pudo preparar el borrador.';prep.disabled=false}}};a.append(pick,prep)}$('drafts').append(a)}if(!data?.length)$('drafts').textContent='Sin borradores.'}
async function init(){const e=++epoch;const {data:{user}}=await db.auth.getUser();if(e!==epoch)return;if(!user){$('notice').textContent='Inicia sesión en el panel principal.';return}const {data:m,error}=await db.from('organization_members').select('organization_id').eq('user_id',user.id).eq('role','owner');if(e!==epoch)return;if(error||!m?.length){$('notice').textContent=error?.message||'Sin negocios autorizados.';return}const {data:o,error:oe}=await db.from('organizations').select('id,name').in('id',m.map(x=>x.organization_id));if(e!==epoch)return;if(oe){$('notice').textContent=oe.message;return}for(const x of o||[])$('org').add(new Option(x.name,x.id));await load()}$('org').onchange=load;db.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT'){++epoch;$('org').replaceChildren();$('items').replaceChildren();$('drafts').replaceChildren();$('notice').textContent='Sesión cerrada.'}});await init();
</script></html>
