<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OfficeAI · Panel integrado</title><style>:root{font-family:system-ui;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1424;color:#edf3ff}header{padding:16px 20px;background:#122139;border-bottom:1px solid #314562}h1{margin:0;font-size:24px}small{color:#b9c9dd}.nav{display:flex;gap:10px;padding:12px 20px;flex-wrap:wrap}button{border:1px solid #536985;border-radius:9px;padding:12px 18px;background:#263d58;color:white;font:inherit;cursor:pointer}button[aria-selected=true]{background:#5fd4b7;color:#092820;border-color:#5fd4b7;font-weight:bold}.pane{display:none}.pane.active{display:block}iframe{display:block;width:100%;height:calc(100vh - 155px);min-height:650px;border:0;background:#0b1424}footer{padding:10px 20px;color:#b9c9dd;font-size:12px}</style></head><body><header><h1>OfficeAI</h1><small>Centro de control y WhatsApp · acceso privado · modo de pruebas</small></header><nav class="nav" role="tablist" aria-label="Secciones OfficeAI"><button id="tab-control" role="tab" aria-controls="control" aria-selected="true">Centro de control</button><button id="tab-whatsapp" role="tab" aria-controls="whatsapp" aria-selected="false">WhatsApp · Conversaciones</button></nav><main><section id="control" class="pane active" role="tabpanel" aria-labelledby="tab-control"><iframe title="Centro de control OfficeAI" src="officeai-completo.html"></iframe></section><section id="whatsapp" class="pane" role="tabpanel" aria-labelledby="tab-whatsapp"><iframe title="Bandeja WhatsApp OfficeAI" src="officeai-whatsapp.html" loading="lazy"></iframe></section></main><footer>Sin envíos automáticos. La bandeja de WhatsApp es de solo lectura.</footer><script>const buttons=[document.getElementById('tab-control'),document.getElementById('tab-whatsapp')],panes=[document.getElementById('control'),document.getElementById('whatsapp')];function select(i){buttons.forEach((b,j)=>b.setAttribute('aria-selected',String(i===j)));panes.forEach((p,j)=>p.classList.toggle('active',i===j));location.hash=i===1?'whatsapp':'control'}buttons.forEach((b,i)=>b.addEventListener('click',()=>select(i)));if(location.hash==='#whatsapp')select(1);</script></body></html>
