<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OfficeAI | Bandeja de recepción</title><style>body{font:16px system-ui;background:#101b30;color:white;margin:0}main{max-width:850px;margin:auto;padding:24px}article,section{background:#20314b;padding:16px;border-radius:12px;margin:12px 0}input,select,button{font:inherit;padding:9px;margin:5px}a{color:#8bd0ff}p{overflow-wrap:anywhere}</style><main><a href="./index.html">Panel principal</a><h1>Bandeja de recepción</h1><form id="login"><input type="email" name="email" placeholder="Correo" required><input type="password" name="password" placeholder="Contraseña" required><button>Entrar</button></form><section id="panel" hidden><button id="refresh">Actualizar</button><button id="logout">Cerrar sesión</button><div id="rows"></div></section><p id="msg" role="status"></p></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/+esm';
const db=createClient('https://zzzodfhbwnpnwnmgjdyw.supabase.co','sb_publishable_Mpgb7CcIhKIJeOsFtYEZ5g_vGZblgzp');const login=document.querySelector('#login'),panel=document.querySelector('#panel'),rows=document.querySelector('#rows'),msg=document.querySelector('#msg');const states={pending:'Pendiente',in_progress:'En revisión',completed:'Resuelta',cancelled:'Descartada'};const types={appointment:'Cita',information:'Información',callback:'Llamada'};const slots={morning:'Mañana',afternoon:'Tarde',any:'Indiferente'};
async function load(){rows.replaceChildren();const {data,error}=await db.from('service_intake_requests').select('id,request_type,preferred_slot,note,status,created_at').order('created_at',{ascending:false}).limit(100);if(error){msg.textContent=error.message;return;}msg.textContent=data.length+' solicitudes visibles';for(const r of data){const a=document.createElement('article');const h=document.createElement('strong');h.textContent=(types[r.request_type]||r.request_type)+' · '+(slots[r.preferred_slot]||r.preferred_slot);const p=document.createElement('p');p.textContent=r.note;const date=document.createElement('p');date.textContent=new Date(r.created_at).toLocaleString('es-ES');const s=document.createElement('select');for(const [k,v] of Object.entries(states)){const o=document.createElement('option');o.value=k;o.textContent=v;s.append(o);}s.value=r.status;const b=document.createElement('button');b.textContent='Guardar estado';b.onclick=async()=>{b.disabled=true;try{const {data,error}=await db.from('service_intake_requests').update({status:s.value}).eq('id',r.id).eq('status',r.status).select('id');if(error||data?.length!==1){msg.textContent=error?.message||'No autorizado o solicitud modificada. Actualiza la bandeja.';return;}await load();}finally{b.disabled=false;}};a.append(h,p,date,s,b);rows.append(a);}}
async function session(){const {data}=await db.auth.getSession();login.hidden=!!data.session;panel.hidden=!data.session;if(data.session)await load();else rows.replaceChildren();}
login.onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:login.elements.email.value,password:login.elements.password.value});login.elements.password.value='';if(error)msg.textContent=error.message;else await session();};document.querySelector('#refresh').onclick=load;document.querySelector('#logout').onclick=async()=>{await db.auth.signOut();msg.textContent='Sesión cerrada';await session();};await session();
</script></html>
