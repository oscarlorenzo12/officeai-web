<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OfficeAI | Bandeja de recepción</title><style>body{font:16px system-ui;background:#101b30;color:white;margin:0}main{max-width:850px;margin:auto;padding:24px}article,section{background:#20314b;padding:16px;border-radius:12px;margin:12px 0}input,select,button{font:inherit;padding:9px;margin:5px}a{color:#8bd0ff}p{overflow-wrap:anywhere}.office-nav{display:flex;flex-wrap:wrap;gap:8px;max-width:1100px;margin:12px auto;padding:12px}.office-nav a{padding:9px 12px;border:1px solid #41536d;border-radius:8px;text-decoration:none;color:#eaf0fb;background:#152238}.office-nav a[aria-current=page]{background:#25456a}@media(max-width:480px){.office-nav a{flex:1 1 35%;text-align:center}}</style><nav class="office-nav" aria-label="Gestión de OfficeAI"><a href="./index.html">Inicio</a><a href="./recepcion-bandeja.html" aria-current="page">Recepción</a><a href="./incorporacion.html">Configuración</a><a href="./requests.html">Solicitudes</a><a href="./tarifas.html">Tarifas</a><a href="./ventas.html">Ventas</a></nav><main><a href="./index.html">Panel principal</a><h1>Bandeja de recepción</h1><form id="login"><input type="email" name="email" placeholder="Correo" required><input type="password" name="password" placeholder="Contraseña" required><button>Entrar</button></form><section id="panel" hidden><label>Negocio <select id="org"></select></label><button id="refresh">Actualizar</button><label><input type="checkbox" id="auto"> Avisos de nuevas solicitudes (mientras la bandeja esté abierta)</label><p id="notice" role="status" aria-live="polite"></p><button id="logout">Cerrar sesión</button><div id="metrics" role="status"></div><label>Filtrar <select id="filter"><option value="all">Todas</option><option value="pending">Pendientes</option><option value="reviewing">En revisión</option><option value="resolved">Resueltas</option><option value="discarded">Descartadas</op const db=createClient('https://zzzodfhbwnpnwnmgjdyw.supabase.co','sb_publishable_Mpgb7CcIhKIJeOsFtYEZ5g_vGZblgzp');const login=document.querySelector('#login'),panel=document.querySelector('#panel'),rows=document.querySelector('#rows'),msg=document.querySelector('#msg');const states={pending:'Pendiente',reviewing:'En revisión',resolved:'Resuelta',discarded:'Descartada'};const types={appointment:'Cita',information:'Información',callback:'Llamada'};const slots={morning:'Mañana',afternoon:'Tarde',any:'Indiferente'};
const org=document.querySelector("#org");let epoch=0,seen=null,busy=false,agenda=false,page=0;const pageSize=50,prev=document.querySelector('#prevPage'),next=document.querySelector('#nextPage'),pageInfo=document.querySelector('#pageInfo');prev.onclick=()=>{if(page>0){page--;void load();}};next.onclick=()=>{page++;void load();};function resetPage(){page=0;return load();}async function poll(){if(busy||!org.value||panel.hidden||!document.querySelector('#auto').checked)return;busy=true;const e=epoch,id=org.value;try{const {data,error}=await db.from('service_intake_requests').select('id').eq('organization_id',id).eq('status','pending').order('created_at',{ascending:false}).limit(100);if(e!==epoch)return;if(error){document.querySelector('#notice').textContent='No se pudieron comprobar los avisos.';return;}if(panel.hidden)return;const ids=new Set(data.map(x=>x.id));if(seen){const n=[...ids].filter(id=>!seen.has(id)).length;if(n)document.querySelector('#notice').textContent=n+' nuevas solicitudes pendientes. Pulsa Actualizar para verlas.';}seen=ids;}finally{busy=false;}}document.querySelector('#auto').onchange=()=>{seen=null;document.querySelector('#notice').textContent='';void poll();};setInterval(poll,30000);async function load(){const e=++epoch,id=org.value;prev.disabled=next.disabled=true;pageInfo.textContent='';rows.replaceChildren();document.querySelector('#agendaSummary').textContent='';document.querySelector('#metrics').textContent='';if(!id||panel.hidden)return;let query=db.from('service_intake_requests').select('id,service_instance_id,request_type,preferred_slot,note,status,created_at,reservation_name,reservation_phone,reservation_date,reservation_time,reservation_guests',{count:'exact'}).eq('organization_id',id);const kind=document.querySelector('#requestKind').value,day=document.querySelector('#reservationDay').value;if(kind==='reservation')query=query.not('reservation_date','is',null);if(kind==='other')query=query.is('reservation_date',null);if(day)query=query.eq('reservation_date',day);if(agenda&&day)query=query.eq('status','resolved');const filter=document.querySelector('#filter').value;if(!(agenda&&day)&&filter!=='all')query=query.eq('status',filter);const {data,error,count}=await (agenda&&day?query.order('reservation_time',{ascending:true}):query.order('created_at',{ascending:false})).order('id',{ascending:true}).range(page*pageSize,page*pageSize+pageSize-1);if(e!==epoch||panel.hidden)return;if(error){msg.textContent=error.message;return;}if(count!==null&&page>0&&page*pageSize>=count){page=Math.max(0,Math.ceil(count/pageSize)-1);return load();}prev.disabled=page===0;next.disabled=count===null||((page+1)*pageSize>=count);pageInfo.textContent='Página '+(page+1)+' de '+Math.max(1,Math.ceil((count??0)/pageSize));msg.textContent=data.length+' solicitudes mostradas de '+(count??'total desconocido');document.querySelector('#metrics').textContent='Consultando totales del negocio…';void Promise.all(Object.entries(states).map(async ([k,v])=>{const {count,error}=await db.from('service_intake_requests').select('id',{count:'exact',head:true}).eq('organization_id',id).eq('status',k);return error?null:v+': '+count;})).then(totals=>{if(e!==epoch||panel.hidden)return;document.querySelector('#metrics').textContent=totals.some(x=>x===null)?'No se pudieron consultar todos los totales.':'Totales del negocio: '+totals.join(' · ');}).catch(()=>{if(e===epoch&&!panel.hidden)document.querySelector('#metrics').textContent='No se pudieron consultar los totales.';});if(agenda&&day)document.querySelector('#agendaSummary').textContent='Agenda '+day+' · '+data.length+' reservas aceptadas · '+data.reduce((n,r)=>n+(r.reservation_guests||0),0)+' comensales en las reservas mostradas'+(count>data.length?' (solo esta página)':'');for(const r of data){const a=document.createElement('article');const h=document.createElement('strong');h.textContent=(types[r.request_type]||r.request_type)+' · '+(slots[r.preferred_slot]||r.preferred_slot);const reservation=!!r.reservation_date;if(reservation)h.textContent='Reserva de mesa · '+({pending:'Pendiente',reviewing:'En revisión',resolved:'Aceptada',discarded:'Rechazada'}[r.status]||r.status);const p=document.createElement('p');p.textContent=reservation?[r.reservation_name,r.reservation_phone,r.reservation_date+' a las '+r.reservation_time.slice(0,5),r.reservation_guests+' comensales',r.note].join(' · '):r.note;const date=document.createElement('p');date.textContent=new Date(r.created_at).toLocaleString('es-ES');const s=document.createElement('select');for(const [k,v] of Object.entries(states)){const o=document.createElement('option');o.value=k;o.textContent=reservation?({resolved:'Aceptada',discarded:'Rechazada'}[k]||v):v;s.append(o);}s.value=r.status;const b=document.createElement('button');b.textContent='Guardar estado';b.onclick=async()=>{if(e!==epoch||panel.hidden)return;if(reservation&&['resolved','discarded'].includes(s.value)&&!confirm('¿Guardar esta decisión interna? No se notificará al cliente automáticamente.'))return;b.disabled=true;try{const {data,error}=await db.from('service_intake_requests').update({status:s.value}).eq('id',r.id).eq('organization_id',id).eq('status',r.status).select('id');if(e!==epoch)return;if(error||data?.length!==1){msg.textContent=error?.message||'No autorizado o solicitud modificada. Actualiza la bandeja.';return;}await load();}finally{b.disabled=false;}};const draft=document.createElement('textarea');draft.rows=4;draft.style.width='95%';draft.setAttribute('aria-label','Borrador de respuesta');draft.value=({appointment:'Gracias por tu solicitud de cita. Hemos recibido tu preferencia de horario. Revisaremos la disponibilidad antes de confirmar la cita.',information:'Gracias por tu consulta. Hemos recibido tu mensaje y revisaremos la información solicitada.',callback:'Gracias por tu solicitud. Revisaremos tu mensaje para organizar una devolución de llamada.'})[r.request_type]||'Gracias por tu mensaje. Revisaremos tu solicitud.';if(reservation)draft.value=r.status==='resolved'?'Tu reserva de mesa ha sido aceptada. Fecha: '+r.reservation_date+' a las '+r.reservation_time.slice(0,5)+'. Comensales: '+r.reservation_guests+'.':r.status==='discarded'?'Lo sentimos, no podemos aceptar tu solicitud de reserva.':'Hemos recibido tu solicitud de reserva. Revisaremos la disponibilidad antes de confirmarla.';const label=document.createElement('p');label.textContent='Respuesta sugerida (editable, no enviada)';const copy=document.createElement('button');copy.textContent='Copiar respuesta';copy.onclick=async()=>{try{await navigator.clipboard.writeText(draft.value);msg.textContent='Borrador copiado. No se ha enviado.';}catch{msg.textContent='No se pudo copiar; selecciona el texto manualmente.';}};a.append(h,p,date);if(reservation&&['pending','reviewing'].includes(r.status)){const availability=document.createElement('p');availability.setAttribute('role','status');availability.textContent='Disponibilidad sin consultar';const check=document.createElement('button');check.textContent='Consultar plazas';check.onclick=async()=>{if(e!==epoch||panel.hidden)return;check.disabled=true;availability.textContent='Consultando…';try{const {data,error}=await db.rpc('officeai_reservation_availability',{p_instance:r.service_instance_id,p_date:r.reservation_date,p_time:r.reservation_time});if(e!==epoch||panel.hidden)return;const v=data?.[0];availability.textContent=error?'No se pudo consultar la disponibilidad.':!v?'Aforo o duración sin configurar.':('Plazas disponibles: '+v.available_guests+' de '+v.capacity+' · Solicitadas: '+r.reservation_guests+(Number(v.available_guests)<r.reservation_guests?' · Capacidad insuficiente':' · Capacidad suficiente')+' · Consulta orientativa, no confirma la reserva.');}catch{if(e===epoch&&!panel.hidden)availability.textContent='No se pudo consultar la disponibilidad.';}finally{check.disabled=false;}};a.append(check,availability);}a.append(s,b,label,draft,copy);rows.append(a);}}
async function session(){page=0;const {data}=await db.auth.getSession();login.hidden=!!data.session;panel.hidden=!data.session;if(data.session){const e=++epoch;const {data:companies,error}=await db.from('organizations').select('id,name').order('name');if(e!==epoch)return;org.replaceChildren();if(error){msg.textContent=error.message;return}for(const c of companies||[])org.add(new Option(c.name,c.id));await load()}else{++epoch;org.replaceChildren();rows.replaceChildren();}}
login.onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:login.elements.email.value,password:login.elements.password.value});login.elements.password.value='';if(error)msg.textContent=error.message;else await session();};org.onchange=()=>{seen=null;document.querySelector('#notice').textContent='';resetPage()};document.querySelector('#dailyAgenda').onclick=()=>{agenda=true;const day=document.querySelector('#reservationDay');if(!day.value)day.value=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());document.querySelector('#requestKind').value='reservation';document.querySelector('#filter').value='resolved';resetPage()};document.querySelector('#filter').onchange=()=>{agenda=false;resetPage()};document.querySelector('#requestKind').onchange=()=>{agenda=false;if(document.querySelector('#requestKind').value==='other')document.querySelector('#reservationDay').value='';resetPage()};document.querySelector('#reservationDay').onchange=()=>{if(!document.querySelector('#reservationDay').value)agenda=false;if(document.querySelector('#reservationDay').value)document.querySelector('#requestKind').value='reservation';resetPage()};document.querySelector('#refresh').onclick=load;document.querySelector('#logout').onclick=async()=>{++epoch;panel.hidden=true;rows.replaceChildren();await db.auth.signOut();seen=null;document.querySelector('#auto').checked=false;document.querySelector('#notice').textContent='';msg.textContent='Sesión cerrada';await session();};await session();
