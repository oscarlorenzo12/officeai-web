<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OfficeAI · Contactos comerciales</title><style>body{font:16px system-ui;background:#0d1729;color:#eff5ff;margin:0}main{max-width:920px;margin:auto;padding:20px}section,article{background:#192841;border:1px solid #334b68;border-radius:14px;padding:18px;margin:14px 0}textarea,input,select,button{font:inherit;padding:10px;border-radius:8px;margin:5px;background:#101c30;color:white;border:1px solid #556882}textarea{box-sizing:border-box;width:100%;min-height:110px}button{background:#389eff;color:#07162b;cursor:pointer}button:disabled{opacity:.5}a{color:#9bd0ff}p{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#bbccdf}</style></head><body><main><h1>Contactos comerciales de OfficeAI</h1><p><a href="./index.html">Panel principal</a> · <a href="./presupuestos.html">Presupuestos</a> · <a href="./ventas.html">Web comercial</a></p><section><h2>Acceso privado</h2><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button id="login">Entrar</button><button id="logout">Salir</button><p id="notice" role="status"></p></section><div id="app" hidden><section><label>Organización <select id="org"></select></label><button id="reload">Actualizar</button><label>Seguimiento <select id="followFilter"><option value="all">Todos</option><option value="new">Nuevos</option><option value="due">Revisar (48 h o más)</option><option value="reviewed">Revisados</option><option value="closed">Cerrados</option></select></label><p id="summary"></p></section><section><h2>Solicitudes de empresas</h2><p><small>Estos contactos proceden del formulario comercial. No son clientes contratados ni presupuestos aprobados. No se envían mensajes desde aquí.</small></p><div id="items"></div></section></div></main><script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.57.0";
const db=createClient("https://zzzodfhbwnpnwnmgjdyw.supabase.co","sb_publishable_Mpgb7CcIhKIJeOsFtYEZ5g_vGZblgzp");
const $=id=>document.getElementById(id);let roles={};let catalog={};const due=x=>x.status==="new"&&Date.now()-Date.parse(x.created_at)>=48*3600000;
function note(t){$("notice").textContent=t}
async function orgs(){const {data:{user}}=await db.auth.getUser();if(!user)return;const {data,error}=await db.from("organization_members").select("organization_id,role").eq("user_id",user.id);if(error){note(error.message);return}roles=Object.fromEntries((data||[]).map(x=>[x.organization_id,x.role]));const ids=Object.keys(roles);$("org").replaceChildren();if(!ids.length){note("No tienes organizaciones asignadas");return}const {data:items,error:err}=await db.from("organizations").select("id,name").in("id",ids);if(err){note(err.message);return}for(const x of items||[])$("org").add(new Option(x.name,x.id));await load()}
async function load(){const id=$("org").value;if(!id)return;const [l,c,f]=await Promise.all([db.from("officeai_inbound_leads").select("id,company_name,contact_name,contact_email,service_code,details,status,created_at").eq("organization_id",id).order("created_at",{ascending:false}).limit(100),db.from("service_catalog").select("code,name,setup_price_eur,monthly_price_eur").eq("organization_id",id).eq("status","active"),db.from("officeai_followup_tasks").select("lead_id,draft_text,officeai_inbound_leads!inner(organization_id)").eq("officeai_inbound_leads.organization_id",id)]);if($("org").value!==id||$("app").hidden)return;const queued=new Map((f.data||[]).map(t=>[t.lead_id,t.draft_text]));if(f.error)note("Seguimientos automáticos no disponibles: "+f.error.message);if(c.error){note("No se pudieron consultar tarifas: "+c.error.message);$("items").replaceChildren();$("summary").textContent="Tarifas no disponibles";return}if(l.error){note("No se pudieron consultar contactos: "+l.error.message);return}catalog=Object.fromEntries((c.data||[]).map(x=>[x.code,x]));const root=$("items");root.replaceChildren();const entries=l.data||[];$("summary").textContent=entries.length+" contactos mostrados · "+entries.filter(x=>x.status==="new").length+" nuevos · "+entries.filter(due).length+" pendientes de revisión ≥48 h";if(!entries.length){root.textContent="Todavía no hay solicitudes comerciales.";return}const filter=$("followFilter").value;const visible=entries.filter(x=>filter==="all"||(filter==="due"?due(x):x.status===filter));if(!visible.length){root.textContent="No hay contactos para este filtro.";return}for(const x of visible){const article=document.createElement("article");const title=document.createElement("h3");title.textContent=x.company_name;article.append(title);if(due(x)){const alert=document.createElement("p");alert.textContent="Seguimiento recomendado: solicitud nueva desde hace al menos 48 horas.";article.append(alert)}for(const line of [x.contact_name+" · "+x.contact_email,"Servicio: "+(catalog[x.service_code]?.name||x.service_code),x.details,"Recibido: "+new Date(x.created_at).toLocaleString("es-ES")]){const p=document.createElement("p");p.textContent=line;article.append(p)}const price=catalog[x.service_code];if(price){const p=document.createElement("p");p.textContent="Tarifa orientativa: "+Number(price.setup_price_eur).toFixed(2)+" € alta + "+Number(price.monthly_price_eur).toFixed(2)+" €/mes, antes de impuestos. No constituye oferta enviada.";article.append(p)}const status=document.createElement("select");for(const [v,t] of [["new","Nuevo"],["reviewed","Revisado"],["closed","Cerrado"]])status.add(new Option(t,v));status.value=x.status;status.disabled=!["owner","admin"].includes(roles[id]);status.onchange=async()=>{status.disabled=true;const {error}=await db.from("officeai_inbound_leads").update({status:status.value}).eq("id",x.id).eq("organization_id",id);note(error?"Error: "+error.message:"Estado actualizado");await load()};article.append(status);if(price&&["owner","admin"].includes(roles[id])){const prepare=document.createElement("button");prepare.textContent="Preparar presupuesto";const feedback=document.createElement("p");feedback.setAttribute("role","status");prepare.onclick=async()=>{prepare.disabled=true;feedback.textContent="Preparando borrador…";try{const {data,error}=await db.rpc("officeai_prepare_lead_quote",{p_lead_id:x.id});if(error)throw error;if(!data)throw new Error("No se recibió el identificador del presupuesto");feedback.textContent="Presupuesto disponible para revisión. No se ha enviado ningún mensaje.";prepare.textContent="Presupuesto preparado";}catch(e){feedback.textContent="No se pudo preparar: "+(e.message||"Error inesperado");prepare.disabled=false;}};article.append(prepare,feedback)}if(x.status!=="closed"&&["owner","admin"].includes(roles[id])){const label=document.createElement("p");label.textContent=queued.has(x.id)&&x.status==="new"?"Seguimiento automático (editable, no enviado)":"Borrador de respuesta comercial (editable, no enviado)";const draft=document.createElement("textarea");draft.setAttribute("aria-label","Borrador de respuesta comercial");const service=price?.name||"el servicio solicitado";draft.value=queued.has(x.id)&&x.status==="new"?queued.get(x.id):x.status==="new"?"Hola "+x.contact_name+", gracias por contactar con OfficeAI. Hemos recibido vuestra consulta sobre "+service+". Revisaremos las necesidades de "+x.company_name+" para preparar una propuesta adecuada. Un saludo, OfficeAI.":"Hola "+x.contact_name+", nos ponemos en contacto para dar seguimiento a vuestra consulta sobre "+service+". ¿Hay algún requisito adicional que debamos tener en cuenta? Un saludo, OfficeAI.";const copy=document.createElement("button");copy.textContent="Copiar borrador";copy.onclick=async()=>{try{await navigator.clipboard.writeText(draft.value);note("Borrador copiado. No se ha enviado ningún mensaje.");}catch{note("No se pudo copiar. Selecciona el texto manualmente.");}};article.append(label,draft,copy);}const link=document.createElement("a");link.href="./presupuestos.html";link.textContent="Consultar presupuestos";article.append(link);root.append(article)}}
async function refresh(){const {data:{session}}=await db.auth.getSession();$("app").hidden=!session;note(session?"Sesión: "+session.user.email:"Inicia sesión para consultar contactos");if(session)await orgs()}
$("login").onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});$("password").value="";if(error)note(error.message);else await refresh()};$("logout").onclick=async()=>{await db.auth.signOut();$("app").hidden=true;note("Sesión cerrada")};$("org").onchange=load;$("reload").onclick=load;$("followFilter").onchange=load;await refresh();
</script></body></html>
