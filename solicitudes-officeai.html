<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OfficeAI · Solicitudes</title><style>body{background:#0b1424;color:#edf3ff;font:16px system-ui;margin:0}main{max-width:900px;margin:auto;padding:20px}section{background:#18263b;border:1px solid #334761;border-radius:12px;padding:18px;margin:16px 0}button,input,select{font:inherit;padding:10px;border-radius:8px;margin:5px}button{background:#5fd4b7;border:0;color:#092820;cursor:pointer}input,select{background:#0b1424;border:1px solid #789;color:white}article{border-top:1px solid #43536a;padding:15px 0}small{color:#b8c7dd}.hidden{display:none}#message{white-space:pre-wrap}a{color:#9bd4ff}</style></head><body><main><h1>OfficeAI · Gestión de solicitudes</h1><p><small>Entorno de pruebas: solo información ficticia. No se confirman citas automáticamente.</small></p><section id="login" class="hidden"><h2>Acceso a OfficeAI</h2><input id="email" type="email" placeholder="Correo" autocomplete="username"><input id="password" type="password" placeholder="Contraseña" autocomplete="current-password"><button id="enter">Entrar</button></section><div id="panel" class="hidden"><section><h2>Negocio</h2><select id="instance"></select><button id="refresh">Actualizar solicitudes</button><p id="summary"></p></section><section><h2>Solicitudes recibidas</h2><div id="requests"></div></section><button id="logout">Cerrar sesión</button></div><section><strong>Estado</strong><p id="message">Comprobando sesión...</p></section><p><a href="./recepcion.html">Volver a recepción</a></p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const sb=createClient('https://zzzodfhbwnpnwnmgjdyw.supabase.co','sb_publishable_Mpgb7CcIhKIJeOsFtYEZ5g_vGZblgzp');const $=id=>document.getElementById(id);const msg=t=>$('message').textContent=t;const labels={pending:'Pendiente',in_progress:'En curso',completed:'Completada',cancelled:'Cancelada'};let currentUser=null;
async function call(action,other={}){const {data:{session},error}=await sb.auth.getSession();if(error||!session)throw Error('No hay sesión válida');const {data,error:apiError}=await sb.functions.invoke('officeai-reception-api',{body:{action,instance_id:$('instance').value,...other}});if(apiError)throw apiError;if(data?.error)throw Error(data.error);return data}
async function boot(){const {data:{user}}=await sb.auth.getUser();currentUser=user;$('login').classList.toggle('hidden',!!user);$('panel').classList.toggle('hidden',!user);if(!user){msg('Inicia sesión con la cuenta de OfficeAI.');return}const {data:membership,error:e}=await sb.from('organization_members').select('organization_id').eq('user_id',user.id);if(e)throw e;if(!membership?.length)throw Error('No se encontró ninguna organización para esta cuenta');const {data:instances,error}=await sb.from('service_instances').select('id,business_name').in('organization_id',membership.map(x=>x.organization_id));if(error)throw error;$('instance').replaceChildren(...(instances||[]).map(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.business_name;return o}));if(!instances?.length){msg('No hay servicios configurados.');return}await load()}
async function load(){msg('Cargando solicitudes...');const result=await call('list_requests');const records=result.requests||[];$('summary').textContent=records.length+' solicitudes · '+records.filter(x=>x.status==='pending').length+' pendientes';$('requests').replaceChildren();if(!records.length){$('requests').textContent='No hay solicitudes registradas';msg('Actualizado');return}for(const r of records){const a=document.createElement('article');const h=document.createElement('strong');h.textContent=(r.request_type==='appointment'?'Solicitud de cita':r.request_type==='callback'?'Solicitud de llamada':'Información')+' · '+(labels[r.status]||r.status);const p=document.createElement('p');p.textContent=(r.note||'Sin nota')+' · '+(r.preferred_slot==='morning'?'Mañana':r.preferred_slot==='afternoon'?'Tarde':'Horario indiferente')+' · '+new Date(r.created_at).toLocaleString('es-ES');const s=document.createElement('select');for(const [value,label] of Object.entries(labels)){const o=document.createElement('option');o.value=value;o.textContent=label;s.append(o)}s.value=r.status;const b=document.createElement('button');b.textContent='Guardar estado';b.onclick=async()=>{try{b.disabled=true;await call('update_request',{request_id:r.id,status:s.value});await load();msg('Estado actualizado. Esto no confirma ninguna cita.')}catch(e){msg('Error: '+e.message)}finally{b.disabled=false}};a.append(h,p,s,b);$('requests').append(a)}msg('Solicitudes actualizadas correctamente')}
$('enter').onclick=async()=>{try{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';await boot()}catch(e){msg('Error: '+e.message)}};$('refresh').onclick=()=>load().catch(e=>msg('Error: '+e.message));$('instance').onchange=()=>load().catch(e=>msg('Error: '+e.message));$('logout').onclick=async()=>{await sb.auth.signOut();await boot()};boot().catch(e=>msg('Error: '+e.message));
</script></body></html>
