<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OfficeAI · Incorporación</title><style>body{font:16px system-ui;background:#0b1220;color:#eaf0fb;max-width:850px;margin:auto;padding:20px}article{background:#152238;border:1px solid #30415c;border-radius:12px;padding:18px;margin:12px 0}a{color:#9fd2ff}button,select{font:inherit;padding:10px;margin:6px}li{margin:8px}</style><h1>Incorporación de negocios</h1><p><a href="./index.html">Panel principal e inicio de sesión</a> · <a href="./tarifas.html">Tarifas</a></p><p>Comprobación de configuración. No activa servicios ni contrata productos.</p><label>Organización <select id="org"></select></label><button id="reload">Actualizar</button><p id="notice" role="status"></p><main id="items"></main><script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.57.0";
const db=createClient("https://zzzodfhbwnpnwnmgjdyw.supabase.co","sb_publishable_Mpgb7CcIhKIJeOsFtYEZ5g_vGZblgzp");const $=id=>document.getElementById(id);let epoch=0;
async function load(){const e=++epoch,id=$('org').value;$('items').replaceChildren();if(!id)return;const {data,error}=await db.from('officeai_onboarding_checklist').select('*').eq('organization_id',id);if(e!==epoch)return;$('notice').textContent=error?error.message:!data?.length?'No hay servicios configurados.':'';if(error)return;for(const x of data||[]){const a=document.createElement('article'),h=document.createElement('h2'),ul=document.createElement('ul');h.textContent=x.business_name;a.append(h,ul);for(const [label,ok] of [['Horarios',x.hours_ready],['Ubicación',x.location_ready],['Preguntas frecuentes',x.faq_ready],['Catálogo activo',x.catalog_ready],['Servicio público activado',x.public_enabled]]){const li=document.createElement('li');li.textContent=(ok?'Configurado: ':'Pendiente: ')+label;ul.append(li)}const edit=document.createElement('button');edit.textContent='Editar configuración';edit.onclick=async()=>{const {data:s,error}=await db.from('service_instances').select('business_name,business_hours,location_text,faq').eq('id',x.id).eq('organization_id',id).single();if(error){$('notice').textContent=error.message;return}if(e!==epoch)return;edit.disabled=true;const form=document.createElement('form');for(const [key,label] of [['business_name','Nombre del negocio'],['business_hours','Horarios'],['location_text','Ubicación']]){const l=document.createElement('label'),input=document.createElement('input');l.textContent=label+' ';input.name=key;input.value=s[key]||'';input.maxLength=key==='business_name'?150:1000;input.required=key==='business_name';l.append(input);form.append(l,document.createElement('br'))}const faqTitle=document.createElement('h3');faqTitle.textContent='Preguntas frecuentes';const faqList=document.createElement('div');form.append(faqTitle,faqList);function addFaq(q='',a=''){if(faqList.children.length>=30)return;const row=document.createElement('p'),question=document.createElement('input'),answer=document.createElement('textarea'),remove=document.createElement('button');question.placeholder='Pregunta';question.setAttribute('aria-label','Pregunta');question.maxLength=500;question.required=true;question.value=q;answer.placeholder='Respuesta confirmada';answer.setAttribute('aria-label','Respuesta');answer.maxLength=2000;answer.required=true;answer.value=a;remove.type='button';remove.textContent='Eliminar';remove.onclick=()=>row.remove();row.append(question,answer,remove);faqList.append(row)}for(const f of Array.isArray(s.faq)?s.faq:[])addFaq(f.question||'',f.answer||'');const add=document.createElement('button');add.type='button';add.textContent='Añadir pregunta';add.onclick=()=>addFaq();form.append(add);const save=document.createElement('button');save.textContent='Guardar cambios';form.append(save);form.onsubmit=async ev=>{ev.preventDefault();if(e!==epoch)return;save.disabled=true;const values=Object.fromEntries(new FormData(form));for(const k of Object.keys(values))values[k]=values[k].trim();if(!values.business_name){save.disabled=false;return}values.faq=Array.from(faqList.children).map(row=>({question:row.querySelector('input').value.trim(),answer:row.querySelector('textarea').value.trim()}));if(values.faq.some(f=>!f.question||!f.answer)||new Set(values.faq.map(f=>f.question.toLocaleLowerCase('es'))).size!==values.faq.length){$('notice').textContent='Revisa las preguntas vacías o duplicadas.';save.disabled=false;return}if(Array.isArray(s.faq)&&s.faq.length>30){$('notice').textContent='La configuración existente supera el límite del editor. No se ha guardado para evitar pérdida de datos.';save.disabled=false;return}const {data:updated,error:ue}=await db.from('service_instances').update(values).eq('id',x.id).eq('organization_id',id).select('id').maybeSingle();if(e!==epoch)return;if(ue||!updated){$('notice').textContent=ue?.message||'Sin permisos para modificar este negocio.';save.disabled=false;return}await load();$('notice').textContent='Configuración guardada. Servicio público sin cambios.'};a.append(form)};a.append(edit);$('items').append(a)}}
async function init(){++epoch;$('items').replaceChildren();$('org').replaceChildren();const {data:{user}}=await db.auth.getUser();if(!user){$('notice').textContent='Inicia sesión en el panel principal.';return}const {data,error}=await db.from('organizations').select('id,name').order('name');if(error){$('notice').textContent=error.message;return}for(const x of data||[])$('org').add(new Option(x.name,x.id));if(!data?.length)$('notice').textContent='No hay organizaciones accesibles.';else await load()}$('org').onchange=load;$('reload').onclick=init;db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){++epoch;$('items').replaceChildren();$('org').replaceChildren();$('notice').textContent='Sesión cerrada.'}});await init();
</script></html>
