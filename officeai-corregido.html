<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OfficeAI corregido</title><style>body{font:16px system-ui;background:#101827;color:white;max-width:900px;margin:auto;padding:20px}section{background:#1c2a41;padding:20px;border-radius:12px;margin:15px 0}input,button,select{padding:10px;font:inherit;margin:4px;border-radius:7px}input,select{background:#101827;color:white}button{background:#367bd1;color:white;border:0}td,th{padding:8px;border-bottom:1px solid #456;text-align:left}.hidden{display:none}</style><h1>OfficeAI · Panel corregido</h1><p id="status">Comprobando sesión…</p><section id="login" class="hidden"><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button id="enter">Entrar</button></section><div id="app" class="hidden"><section><h2>Organización</h2><select id="org"></select><button id="refresh">Actualizar</button><p id="metrics"></p></section><section><h2>Empresas</h2><div style="overflow:auto"><table><thead><tr><th>Empresa</th><th>Sector</th><th>Ciudad</th><th>Estado</th></tr></thead><tbody id="companies"></tbody></table></div></section><section><h2>Trabajos</h2><p id="jobs"></p></section><section><h2>Oportunidades</h2><p id="opportunities"></p></section><button id="logout">Salir</button></div><section><h2>Registro</h2><p id="log"></p></section><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const db=createClient('https://zzzodfhbwnpnwnmgjdyw.supabase.co','sb_publishable_Mpgb7CcIhKIJeOsFtYEZ5g_vGZblgzp');const $=id=>document.getElementById(id);let org=null;const say=x=>$('log').textContent=x;
async function start(){const {data:{user}}=await db.auth.getUser();$('login').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);$('status').textContent=user?'Sesión iniciada':'Inicia sesión';if(!user)return;const {data,error}=await db.from('organization_members').select('organization_id').eq('user_id',user.id);if(error)throw error;if(!data?.length)throw Error('Esta cuenta no tiene organizaciones');const ids=data.map(x=>x.organization_id);const {data:orgs,error:e}=await db.from('organizations').select('id,name').in('id',ids);if(e)throw e;const names=new Map((orgs||[]).map(x=>[x.id,x.name]));$('org').replaceChildren(...ids.map(id=>{const o=document.createElement('option');o.value=id;o.textContent=names.get(id)||'Organización '+id.slice(0,8);return o}));org=ids[0];await refresh()}
async function refresh(){org=$('org').value;const [p,j,o]=await Promise.all([db.from('crm_prospects').select('company_name,sector,city,status').eq('organization_id',org),db.from('crm_research_jobs').select('job_type,status').eq('organization_id',org),db.from('crm_opportunities').select('service,stage').eq('organization_id',org)]);for(const x of [p,j,o])if(x.error)throw x.error;$('companies').replaceChildren(...(p.data||[]).map(x=>{const tr=document.createElement('tr');for(const k of ['company_name','sector','city','status']){const td=document.createElement('td');td.textContent=x[k]??'';tr.append(td)}return tr}));$('metrics').textContent=(p.data||[]).length+' empresas · '+(j.data||[]).length+' trabajos · '+(o.data||[]).length+' oportunidades';$('jobs').textContent=(j.data||[]).map(x=>x.job_type+' ('+x.status+')').join(' | ')||'Sin trabajos';$('opportunities').textContent=(o.data||[]).map(x=>x.service+' ('+x.stage+')').join(' | ')||'Sin oportunidades';say('Organización y datos cargados')}
$('enter').onclick=async()=>{try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';await start()}catch(e){say(e.message)}};$('refresh').onclick=()=>refresh().catch(e=>say(e.message));$('org').onchange=()=>refresh().catch(e=>say(e.message));$('logout').onclick=async()=>{await db.auth.signOut();await start()};start().catch(e=>say('Error: '+e.message));
</script></html>
