<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OfficeAI · Contratos</title><style>body{font:16px system-ui;background:#0b1220;color:#eaf0fb;max-width:850px;margin:auto;padding:20px}a{color:#9fd2ff}form,article{background:#152238;padding:16px;border-radius:12px;margin:12px 0}label{display:block;margin:10px 0}input,select,button{font:inherit;padding:8px;max-width:95%}.office-nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 24px}.office-nav a{padding:9px 12px;border:1px solid #41536d;border-radius:8px;text-decoration:none}.office-nav a[aria-current=page]{background:#25456a}button{cursor:pointer;border-radius:7px}button:disabled{opacity:.6}@media(max-width:480px){.office-nav a{flex:1 1 35%;text-align:center}}</style><h1>Contratación de servicios</h1><nav class="office-nav" aria-label="Gestión de OfficeAI"><a href="./index.html">Inicio</a><a href="./contratos.html" aria-current="page">Contratos</a><a href="./finanzas.html">Finanzas</a><a href="./facturacion.html">Facturación</a></nav><p>Registro interno de borradores. No formaliza contratos, activa servicios ni realiza cobros.</p><label>Negocio <select id="org"></select></label><form id="draft" hidden><label>Servicio <input id="name" required maxlength="150"></label><label>Alta (€) <input id="setup" type="number" min="0" max="9999999999.99" step=".01" required></label><label>Cuota mensual (€) <input id="monthly" type="number" min="0" max="9999999999.99" step=".01" required></label><button id="save">Guardar borrador</button></form><p id="notice" role="status"></p><p id="totals"></p><main id="items"></main><script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.57.0";
const db=createClient("https://zzzodfhbwnpnwnmgjdyw.supabase.co","sb_publishable_Mpgb7CcIhKIJeOsFtYEZ5g_vGZblgzp");const $=id=>document.getElementById(id);let epoch=0;let owners=new Set();const money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n);
async function load(){const e=++epoch,id=$('org').value;$('items').replaceChildren();$('totals').textContent='';$('draft').hidden=!id;$('notice').textContent='';if(!id)return;const {data,error}=await db.from('officeai_service_contracts').select('id,service_name,setup_eur,monthly_eur,status,created_at,source_quote_id,cancellation_effective_date,service_instance_id,cancellation_reviewed_at,manual_acceptance_at').eq('organization_id',id).order('created_at',{ascending:false});if(e!==epoch)return;if(error){$('notice').textContent=error.message;return}const {data:services,error:se}=await db.from('service_instances').select('id,service_name,business_name').eq('organization_id',id);if(e!==epoch)return;if(se){$('notice').textContent=se.message;return}const {data:reviews,error:re}=await db.from('officeai_reception_cancellation_preview').select('contract_id,review_status,public_enabled').eq('organization_id',id);if(e!==epoch)return;if(re){$('notice').textContent=re.message;return}const reviewMap=new Map((reviews||[]).map(v=>[v.contract_id,v]));const active=(data||[]).filter(x=>x.status==='active'&&(!x.cancellation_effective_date||x.cancellation_effective_date>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Madrid'}).format(new Date())));$('totals').textContent='Cuotas mensuales activas (no cobradas): '+money(active.reduce((s,x)=>s+Number(x.monthly_eur),0));for(const x of data||[]){const a=document.createElement('article');a.textContent=x.service_name+' · Alta: '+money(x.setup_eur)+' · Mensual: '+money(x.monthly_eur)+' · '+({draft:'Borrador',active:'Activo',cancelled:'Cancelado'}[x.status]||x.status);const linked=(services||[]).find(v=>v.id===x.service_instance_id);const serviceLabel=document.createElement('p');serviceLabel.textContent='Servicio vinculado: '+(linked?linked.service_name+' · '+linked.business_name:'Sin vincular');a.append(serviceLabel);if(owners.has(id)&&!x.cancellation_effective_date&&['draft','active'].includes(x.status)&&(services||[]).length){const sel=document.createElement('select');sel.setAttribute('aria-label','Servicio del contrato');sel.add(new Option('Seleccionar servicio',''));for(const v of services)sel.add(new Option(v.service_name+' · '+v.business_name,v.id));sel.value=x.service_instance_id||'';const b=document.createElement('button');b.textContent='Vincular servicio';b.onclick=async()=>{if(e!==epoch||!sel.value||!confirm('¿Vincular este servicio al contrato? No se activa ni desactiva ningún servicio.'))return;b.disabled=true;try{const {error}=await db.rpc('officeai_link_contract_service',{p_contract:x.id,p_service:sel.value});if(e!==epoch)return;if(error){$('notice').textContent=error.message;return}await load()}finally{b.disabled=false}};a.append(sel,b)}if(x.cancellation_effective_date){const p=document.createElement('p');p.textContent=(x.cancellation_effective_date<=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Madrid'}).format(new Date())?'BAJA VENCIDA · Revisar desactivación del servicio concreto · ':'Baja programada · ')+x.cancellation_effective_date+' · Revisar mensualidades ya registradas y periodo parcial.';a.append(p);const reviewInfo=reviewMap.get(x.id);const review=reviewInfo?.review_status;if(review){const note=document.createElement('p');note.textContent=({unlinked:'No desactivar: contrato sin servicio vinculado.',shared_active:'No desactivar: otro contrato vigente utiliza este servicio.',review_required:'Servicio candidato a desactivación: requiere revisión del propietario.'})[review]||'Revisión pendiente';a.append(note);if(reviewInfo.public_enabled!==null){const state=document.createElement('p');state.textContent='Recepción pública: '+(reviewInfo.public_enabled?'habilitada':'deshabilitada');a.append(state)}if(x.cancellation_reviewed_at){const done=document.createElement('p');done.textContent='Revisión administrativa registrada: '+new Date(x.cancellation_reviewed_at).toLocaleString('es-ES');a.append(done);if(owners.has(id)&&review==='review_required'&&reviewInfo.public_enabled===true){const off=document.createElement('button');off.textContent='Desactivar recepción pública';off.onclick=async()=>{if(e!==epoch||!confirm('¿Desactivar únicamente la recepción web pública vinculada? WhatsApp y cobros no se modifican.'))return;off.disabled=true;try{const {error}=await db.rpc('officeai_disable_cancelled_reception',{p_contract:x.id});if(e!==epoch)return;if(error){$('notice').textContent=error.message;return}await load()}finally{off.disabled=false}};a.append(off)}}else if(owners.has(id)){const b=document.createElement('button');b.textContent='Registrar revisión de baja';b.onclick=async()=>{if(e!==epoch||!confirm('¿Confirmar revisión administrativa? Esto no desactiva servicios ni modifica cobros.'))return;b.disabled=true;try{const {error}=await db.rpc('officeai_complete_cancellation_review',{p_id:x.id});if(e!==epoch)return;if(error){$('notice').textContent=error.message;return}await load()}finally{b.disabled=false}};a.append(b)}}}else if(x.status==='active'&&owners.has(id)){const b=document.createElement('button');b.textContent='Programar baja (30 días)';b.onclick=async()=>{if(e!==epoch||!confirm('¿Registrar baja con 30 días de preaviso? No elimina cobros existentes ni desactiva servicios automáticamente.'))return;b.disabled=true;try{const {error}=await db.rpc('officeai_schedule_contract_cancellation',{p_id:x.id});if(e!==epoch)return;if(error){$('notice').textContent=error.message;return}await load()}finally{b.disabled=false}};a.append(b)}if(x.source_quote_id){const p=document.createElement('p');p.textContent='Origen: presupuesto aprobado · '+x.source_quote_id;const link=document.createElement('a');link.href='./presupuestos.html';link.textContent='Consultar presupuestos';p.append(document.createTextNode(' · '),link);a.append(p)}else{const p=document.createElement('p');p.textContent='Origen: registro manual';a.append(p);const note=document.createElement('p');note.textContent=x.manual_acceptance_at?'Aceptación registrada: '+new Date(x.manual_acceptance_at).toLocaleString('es-ES'):'Sin aceptación manual registrada';a.append(note);if(x.status==='draft'&&!x.manual_acceptance_at&&owners.has(id)){const b=document.createElement('button');b.textContent='Registrar aceptación del contrato';b.onclick=async()=>{if(e!==epoch)return;const ref=prompt('Referencia de aceptación expresa del cliente, sin datos sensibles');if(!ref?.trim()||ref.trim().length>500||!confirm('¿Confirmas la aceptación expresa de estas condiciones?'))return;b.disabled=true;try{const {error}=await db.rpc('officeai_record_manual_contract_acceptance',{p_id:x.id,p_reference:ref.trim()});if(e!==epoch)return;if(error){$('notice').textContent=error.message;return}await load()}finally{b.disabled=false}};a.append(b)}}if(x.status==='draft'&&owners.has(id)){for(const [status,label] of [['active','Aprobar registro interno'],['cancelled','Cancelar borrador']]){const b=document.createElement('button');b.textContent=label;if(status==='active'&&!x.source_quote_id&&!x.manual_acceptance_at)b.disabled=true;b.onclick=async()=>{if(e!==epoch||!confirm(label+' de '+x.service_name+'? No se enviarán mensajes ni se realizarán cobros.'))return;for(const button of a.querySelectorAll('button'))button.disabled=true;const {error}=await db.rpc('officeai_decide_contract',{p_id:x.id,p_status:status});if(e!==epoch)return;if(error){$('notice').textContent=error.message;for(const button of a.querySelectorAll('button'))button.disabled=false;return}await load()};a.append(b)}}if(x.status==='active'&&Number(x.setup_eur)>0&&owners.has(id)){const b=document.createElement('button');b.textContent='Preparar borrador de alta';b.onclick=async()=>{if(e!==epoch)return;const raw=prompt('IVA confirmado (%), o vacío si pendiente');if(raw===null)return;const vat=raw.trim()===''?null:Number(raw.replace(',','.'));if(vat!==null&&(!Number.isFinite(vat)||vat<0||vat>100)){$('notice').textContent='IVA no válido';return}b.disabled=true;try{const {error}=await db.rpc('officeai_prepare_setup_draft',{p_contract:x.id,p_vat:vat});if(e===epoch)$('notice').textContent=error?error.message:'Borrador de alta disponible en Facturación.'}finally{b.disabled=false}};a.append(b)}$('items').append(a)}if(!data?.length)$('notice').textContent='Sin contratos registrados.'}
async function init(){const e=++epoch;const {data:{user}}=await db.auth.getUser();if(e!==epoch)return;if(!user){$('notice').textContent='Inicia sesión en el panel principal.';return}const {data:m,error}=await db.from('organization_members').select('organization_id,role').eq('user_id',user.id).in('role',['owner','admin']);if(e!==epoch)return;if(error||!m?.length){$('notice').textContent=error?.message||'No tienes negocios administrables.';return}owners=new Set(m.filter(x=>x.role==='owner').map(x=>x.organization_id));const {data:o,error:oe}=await db.from('organizations').select('id,name').in('id',m.map(x=>x.organization_id));if(e!==epoch)return;if(oe){$('notice').textContent=oe.message;return}for(const x of o||[])$('org').add(new Option(x.name,x.id));await load()}
$('org').onchange=()=>{$('draft').reset();load()};$('draft').onsubmit=async ev=>{ev.preventDefault();const id=$('org').value,e=epoch,name=$('name').value.trim();if(!id||!name||!confirm('¿Guardar únicamente un borrador interno?'))return;$('save').disabled=true;try{const {error}=await db.from('officeai_service_contracts').insert({organization_id:id,service_name:name,setup_eur:Number($('setup').value),monthly_eur:Number($('monthly').value),status:'draft'});if(e!==epoch)return;if(error)throw error;$('draft').reset();await load();$('notice').textContent='Borrador guardado.'}catch(err){if(e===epoch)$('notice').textContent=err.message}finally{$('save').disabled=false}};db.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT'){++epoch;owners.clear();$('totals').textContent='';$('org').replaceChildren();$('items').replaceChildren();$('draft').reset();$('draft').hidden=true;$('notice').textContent='Sesión cerrada.'}});await init();
</script></html>
