<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OfficeAI · Contratos</title><style>body{font:16px system-ui;background:#0b1220;color:#eaf0fb;max-width:850px;margin:auto;padding:20px}a{color:#9fd2ff}form,article{background:#152238;padding:16px;border-radius:12px;margin:12px 0}label{display:block;margin:10px 0}input,select,button{font:inherit;padding:8px;max-width:95%}</style><h1>Contratación de servicios</h1><a href="./index.html">Panel principal</a><p>Registro interno de borradores. No formaliza contratos, activa servicios ni realiza cobros.</p><label>Negocio <select id="org"></select></label><form id="draft" hidden><label>Servicio <input id="name" required maxlength="150"></label><label>Alta (€) <input id="setup" type="number" min="0" max="9999999999.99" step=".01" required></label><label>Cuota mensual (€) <input id="monthly" type="number" min="0" max="9999999999.99" step=".01" required></label><button id="save">Guardar borrador</button></form><p id="notice" role="status"></p><main id="items"></main><script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.57.0";
const db=createClient("https://zzzodfhbwnpnwnmgjdyw.supabase.co","sb_publishable_Mpgb7CcIhKIJeOsFtYEZ5g_vGZblgzp");const $=id=>document.getElementById(id);let epoch=0;const money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n);
async function load(){const e=++epoch,id=$('org').value;$('items').replaceChildren();$('draft').hidden=!id;$('notice').textContent='';if(!id)return;const {data,error}=await db.from('officeai_service_contracts').select('service_name,setup_eur,monthly_eur,status,created_at').eq('organization_id',id).order('created_at',{ascending:false});if(e!==epoch)return;if(error){$('notice').textContent=error.message;return}for(const x of data||[]){const a=document.createElement('article');a.textContent=x.service_name+' · Alta: '+money(x.setup_eur)+' · Mensual: '+money(x.monthly_eur)+' · '+({draft:'Borrador',active:'Activo',cancelled:'Cancelado'}[x.status]||x.status);$('items').append(a)}if(!data?.length)$('notice').textContent='Sin contratos registrados.'}
async function init(){const e=++epoch;const {data:{user}}=await db.auth.getUser();if(e!==epoch)return;if(!user){$('notice').textContent='Inicia sesión en el panel principal.';return}const {data:m,error}=await db.from('organization_members').select('organization_id').eq('user_id',user.id).in('role',['owner','admin']);if(e!==epoch)return;if(error||!m?.length){$('notice').textContent=error?.message||'No tienes negocios administrables.';return}const {data:o,error:oe}=await db.from('organizations').select('id,name').in('id',m.map(x=>x.organization_id));if(e!==epoch)return;if(oe){$('notice').textContent=oe.message;return}for(const x of o||[])$('org').add(new Option(x.name,x.id));await load()}
$('org').onchange=()=>{$('draft').reset();load()};$('draft').onsubmit=async ev=>{ev.preventDefault();const id=$('org').value,e=epoch,name=$('name').value.trim();if(!id||!name||!confirm('¿Guardar únicamente un borrador interno?'))return;$('save').disabled=true;try{const {error}=await db.from('officeai_service_contracts').insert({organization_id:id,service_name:name,setup_eur:Number($('setup').value),monthly_eur:Number($('monthly').value),status:'draft'});if(e!==epoch)return;if(error)throw error;$('draft').reset();await load();$('notice').textContent='Borrador guardado.'}catch(err){if(e===epoch)$('notice').textContent=err.message}finally{$('save').disabled=false}};db.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT'){++epoch;$('org').replaceChildren();$('items').replaceChildren();$('draft').reset();$('draft').hidden=true;$('notice').textContent='Sesión cerrada.'}});await init();
</script></html>
