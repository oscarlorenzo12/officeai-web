<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OfficeAI · Finanzas</title><style>body{font:16px system-ui;background:#0b1220;color:#eaf0fb;max-width:850px;margin:auto;padding:20px}a{color:#9fd2ff}article{background:#152238;padding:16px;margin:10px 0;border-radius:10px}button,input,select{font:inherit;padding:8px;margin:5px}.office-nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 24px}.office-nav a{padding:9px 12px;border:1px solid #41536d;border-radius:8px;text-decoration:none}.office-nav a[aria-current=page]{background:#25456a}button{cursor:pointer;border-radius:7px}button:disabled{opacity:.6}@media(max-width:480px){.office-nav a{flex:1 1 35%;text-align:center}}@media print{.office-nav{display:none!important}}</style><h1>Control de mensualidades</h1><nav class="office-nav" aria-label="Gestión de OfficeAI"><a href="./index.html">Inicio</a><a href="./contratos.html">Contratos</a><a href="./finanzas.html" aria-current="page">Finanzas</a><a href="./facturacion.html">Facturación</a></nav><p>Registro interno; no emite facturas ni cobra dinero.</p><label>Negocio <select id="org"></select></label><label>Mes <input type="month" id="month"></label><form id="generate" hidden><label>Vencimiento <input type="date" id="due" required></label><button id="gen">Generar cuotas del mes</button></form><p id="notice" role="status"></p><p id="totals"></p><main id="items"></main><script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.57.0";
const db=createClient("https://zzzodfhbwnpnwnmgjdyw.supabase.co","sb_publishable_Mpgb7CcIhKIJeOsFtYEZ5g_vGZblgzp");const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n);let epoch=0,owners=new Set();const today=()=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return p.year+'-'+p.month+'-'+p.day};$('month').value=today().slice(0,7);
async function load(){const e=++epoch,id=$('org').value,period=$('month').value+'-01';$('items').replaceChildren();$('totals').textContent='';$('generate').hidden=!owners.has(id)||!$('month').value;if(!id||!$('month').value)return;$('due').min=period;const [y,m]=$('month').value.split('-').map(Number);$('due').max=$('month').value+'-'+String(new Date(Date.UTC(y,m,0)).getUTCDate()).padStart(2,'0');if(!$('due').value.startsWith($('month').value+'-'))$('due').value='';const {data,error}=await db.from('officeai_monthly_payments').select('id,amount_eur,due_date,paid_at,officeai_service_contracts!inner(service_name,organization_id)').eq('officeai_service_contracts.organization_id',id).eq('period',period).order('due_date');if(e!==epoch)return;if(error){$('notice').textContent=error.message;return}let paid=0,pending=0,late=0;for(const x of data||[]){const n=Number(x.amount_eur),status=x.paid_at?'Cobrado':x.due_date<today()?'Vencido':'Pendiente';if(x.paid_at)paid+=n;else if(status==='Vencido')late+=n;else pending+=n;const a=document.createElement('article');a.textContent=x.officeai_service_contracts.service_name+' · '+money(n)+' · '+x.due_date+' · '+status;if(!x.paid_at&&owners.has(id)){const b=document.createElement('button');b.textContent='Confirmar pago recibido';b.onclick=async()=>{if(e!==epoch||!confirm('¿Has comprobado que se recibió realmente este pago?'))return;b.disabled=true;const {error}=await db.rpc('officeai_confirm_received_payment',{p_id:x.id});if(e!==epoch)return;if(error){$('notice').textContent=error.message;b.disabled=false}else await load()};a.append(b)}if(owners.has(id)){const draft=document.createElement('button');draft.textContent='Preparar borrador fiscal';draft.onclick=async()=>{if(e!==epoch)return;const raw=prompt('Tipo de IVA confirmado (%). Deja vacío si está pendiente de revisión.');if(raw===null)return;const vat=raw.trim()===''?null:Number(raw.replace(',','.'));if(vat!==null&&(!Number.isFinite(vat)||vat<0||vat>100)){ $('notice').textContent='Tipo de IVA no válido.';return}draft.disabled=true;try{const {error}=await db.rpc('officeai_prepare_billing_draft',{p_payment:x.id,p_vat:vat});if(e!==epoch)return;$('notice').textContent=error?error.message:'Borrador disponible en Facturación. Si ya existía, se conserva.'}finally{draft.disabled=false}};a.append(draft)}$('items').append(a)}$('totals').textContent='Registrado: '+money(paid+pending+late)+' · Cobrado: '+money(paid)+' · Pendiente: '+money(pending)+' · Vencido: '+money(late);$('notice').textContent=data?.length?'':'Sin mensualidades registradas para este mes.'}
async function init(){const e=++epoch;const {data:{user}}=await db.auth.getUser();if(e!==epoch)return;if(!user){$('notice').textContent='Inicia sesión en el panel principal.';return}const {data:m,error}=await db.from('organization_members').select('organization_id,role').eq('user_id',user.id).in('role',['owner','admin']);if(e!==epoch)return;if(error||!m?.length){$('notice').textContent=error?.message||'Sin negocios administrables.';return}owners=new Set(m.filter(x=>x.role==='owner').map(x=>x.organization_id));const {data:o,error:oe}=await db.from('organizations').select('id,name').in('id',m.map(x=>x.organization_id));if(e!==epoch)return;if(oe){$('notice').textContent=oe.message;return}for(const x of o||[])$('org').add(new Option(x.name,x.id));await load()}$('generate').onsubmit=async ev=>{ev.preventDefault();const id=$('org').value,period=$('month').value+'-01',due=$('due').value,e=epoch;if(!owners.has(id)||!due||!confirm('¿Generar registros internos de cuotas? No se emitirán facturas ni cargos.'))return;$('gen').disabled=true;try{const {data,error}=await db.rpc('officeai_generate_monthly_register',{p_org:id,p_period:period,p_due:due});if(e!==epoch)return;if(error)throw error;await load();$('notice').textContent='Mensualidades nuevas: '+data}catch(err){if(e===epoch)$('notice').textContent=err.message}finally{$('gen').disabled=false}};$('org').onchange=load;$('month').onchange=load;db.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT'){++epoch;owners.clear();$('generate').hidden=true;$('org').replaceChildren();$('items').replaceChildren();$('totals').textContent='';$('notice').textContent='Sesión cerrada.'}});await init();
</script></html>
