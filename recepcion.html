<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OfficeAI · Recepción</title><style>body{font:16px system-ui;background:#0d1525;color:#f4f7ff;margin:0}main{max-width:780px;margin:auto;padding:24px}section{background:#19273c;border-radius:14px;padding:18px;margin:16px 0}input,select,textarea{display:block;width:100%;box-sizing:border-box;background:#0d1525;color:#fff;border:1px solid #7c8ba5;border-radius:8px;padding:12px;margin:7px 0 14px;font:inherit}button{border:0;border-radius:8px;padding:12px;background:#63d8b9;color:#07291e;font:inherit;cursor:pointer;margin:4px}.hidden{display:none}small{color:#c3cddd}article{padding:10px;border-bottom:1px solid #4b5870}#status{white-space:pre-wrap}</style></head><body><main><h1>OfficeAI · Recepción</h1><small>Entorno de pruebas. No introduzcas información real de clientes.</small><section id="login"><h2>Iniciar sesión</h2><label>Correo<input id="email" type="email" autocomplete="username"></label><label>Contraseña<input id="password" type="password" autocomplete="current-password"></label><button id="enter">Entrar</button></section><div id="app" class="hidden"><section><button id="logout">Salir</button><h2>Servicio</h2><select id="instances"></select><button id="reload">Actualizar</button><p id="detail"></p></section><section><h2>Preguntas frecuentes</h2><input id="question" placeholder="¿Cuál es vuestro horario?"><button id="answerbtn">Responder</button><p id="answer"></p><small>Respuestas predefinidas; no hay modelo de IA conectado.</small></section><section><h2>Solicitud ficticia</h2><label>Tipo<select id="type"><option value="information">Información</option><option value="appointment">Solicitud de cita</option><option value="callback">Llamada</option></select></label><label>Franja<select id="slot"><option value="any">Indiferente</option><option value="morning">Mañana</option><option value="afternoon">Tarde</option></select></label><label>Nota<textarea id="note" maxlength="1000" placeholder="Solo datos ficticios"></textarea></label><button id="save">Registrar solicitud de prueba</button></section><section><h2>Solicitudes registradas</h2><div id="requests"></div></section></div><p id="status" role="status"></p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const sb=createClient('https://zzzodfhbwnpnwnmgjdyw.supabase.co','sb_publishable_Mpgb7CcIhKIJeOsFtYEZ5g_vGZblgzp');
const el=id=>document.getElementById(id);let org=null,instances=[];const msg=s=>el('status').textContent=s||'';
async function boot(){const {data:{user}}=await sb.auth.getUser();el('login').classList.toggle('hidden',!!user);el('app').classList.toggle('hidden',!user);if(!user)return;const {data,error}=await sb.from('organization_members').select('organization_id').eq('user_id',user.id).limit(1);if(error||!data?.length){msg('No se ha encontrado una organización autorizada.');return}org=data[0].organization_id;await reload()}
async function reload(){msg('');const {data,error}=await sb.from('service_instances').select('id,business_name,business_hours,location_text').eq('organization_id',org);if(error){msg(error.message);return}instances=data||[];el('instances').replaceChildren(...instances.map(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.business_name;return o}));details();await requests()}
function details(){const x=instances.find(y=>y.id===el('instances').value);el('detail').textContent=x?'Horario: '+(x.business_hours||'No configurado')+' · Ubicación: '+(x.location_text||'No configurada'):'No hay servicios configurados'}
async function requests(){el('requests').replaceChildren();const id=el('instances').value;if(!id)return;const {data,error}=await sb.from('service_intake_requests').select('id,request_type,preferred_slot,status,note,created_at').eq('service_instance_id',id).order('created_at',{ascending:false}).limit(50);if(error){msg(error.message);return}for(const r of data||[]){const a=document.createElement('article');a.textContent=new Date(r.created_at).toLocaleString('es-ES')+' · '+r.request_type+' · '+r.status+' · '+(r.note||'Sin nota');el('requests').append(a)}}
async function api(body){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('Sesión caducada');const res=await fetch('https://zzzodfhbwnpnwnmgjdyw.supabase.co/functions/v1/officeai-reception-api',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':'sb_publishable_Mpgb7CcIhKIJeOsFtYEZ5g_vGZblgzp'},body:JSON.stringify({...body,instance_id:el('instances').value})});const result=await res.json();if(!res.ok)throw Error(result.error||'Error de solicitud');return result}
el('enter').onclick=async()=>{msg('');const {error}=await sb.auth.signInWithPassword({email:el('email').value,password:el('password').value});if(error){msg(error.message);return}el('password').value='';await boot()};
el('logout').onclick=async()=>{await sb.auth.signOut();org=null;await boot()};el('instances').onchange=async()=>{details();await requests()};el('reload').onclick=reload;
el('answerbtn').onclick=async()=>{try{msg('');const r=await api({action:'answer',question:el('question').value});el('answer').textContent=r.answer}catch(e){msg(e.message)}};
el('save').onclick=async()=>{try{msg('');const r=await api({action:'intake',request_type:el('type').value,preferred_slot:el('slot').value,note:el('note').value});el('note').value='';msg('Solicitud ficticia registrada: '+r.status);await requests()}catch(e){msg(e.message)}};
boot().catch(e=>msg(e.message));
</script></body></html>
